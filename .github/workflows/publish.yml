# publish.yml — PyPI Trusted Publishing workflow
#
# ONE-TIME SETUP (on PyPI):
#   1. Create an account at https://pypi.org and log in.
#   2. Go to https://pypi.org/manage/account/publishing/
#   3. Click "Add a new publisher" and fill in:
#      - PyPI project name:  md2p
#      - GitHub owner:       raulkivi
#      - Repository name:    md2p
#      - Workflow filename:  publish.yml
#      - Environment name:   pypi
#
#   Full guide: https://docs.pypi.org/trusted-publishers/
#
# PUBLISHING A RELEASE:
#   Bump `version` in pyproject.toml, then push a matching tag:
#     git tag v1.0 && git push origin v1.0

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish md2p
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false  # a poisoned cache must not reach a published release
      - name: Build
        run: uv build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
